# LiveKit Server com limites para não disputar recursos com os outros sistemas da VPS.
services:
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    # host network: WebRTC precisa das portas UDP 50000-60000 sem NAT do Docker
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
