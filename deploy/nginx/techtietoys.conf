# Nginx — app e sinalização do LiveKit. Troque TROCAR_DOMINIO.
# Certificados: certbot --nginx -d TROCAR_DOMINIO -d live.TROCAR_DOMINIO

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# App (Next.js + Socket.IO)
server {
  listen 80;
  server_name TROCAR_DOMINIO;

  client_max_body_size 5m;

  location / {
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s; # conexões Socket.IO longas
  }
}

# LiveKit (sinalização WebSocket; a mídia vai direto pelas portas UDP/TCP do LiveKit)
server {
  listen 80;
  server_name live.TROCAR_DOMINIO;

  location / {
    proxy_pass http://127.0.0.1:7880;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }
}
